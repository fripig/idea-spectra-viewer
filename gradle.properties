pluginGroup = com.github.fripig.spectraviewer
pluginName = Spectra Viewer
pluginVersion = 0.1.0

# Build against IntelliJ IDEA so the plugin installs into every JetBrains IDE
# that ships the platform module, PhpStorm included. 2026.2 matches build 262.
platformVersion = 2026.2

pluginSinceBuild = 262

org.gradle.jvmargs = -Xmx2048m
org.gradle.caching = true
org.gradle.configuration-cache = true
kotlin.stdlib.default.dependency = false
